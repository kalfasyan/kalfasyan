# Mirrors the portfolio page to kalfasyan/kalfasyan.github.io so it is served
# at https://kalfasyan.github.io/ (GitHub only serves the root URL from that repo).
# All editing happens here; the target repo is overwritten on every publish.
name: Publish site to kalfasyan.github.io

on:
  push:
    branches: [main]
    paths:
      - index.html
      - robots.txt
      - sitemap.xml
      - google56cf7b978acf8a15.html
      - images/**
      - docs/**
      - .github/workflows/publish-root-site.yml
  workflow_dispatch:

concurrency:
  group: publish-root-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html robots.txt sitemap.xml google56cf7b978acf8a15.html images docs _site/

      - name: Push to kalfasyan.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: kalfasyan/kalfasyan.github.io
          publish_branch: main
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Publish ${{ github.sha }} from kalfasyan/kalfasyan"
